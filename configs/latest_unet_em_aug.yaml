# ============================================================================
# Latest UNet + Standard EM Augmentation — 14 classes, full EM aug pipeline
# ============================================================================
# Same architecture and training settings as latest_unet.yaml, but with
# standard EM augmentations: flips, 90° rotations, intensity jitter,
# Gaussian noise, gamma correction, elastic deformation.
#
# Purpose: Does standard EM augmentation improve generalization across
# resolution bands compared to the unaugmented latest_unet?
inherits: base.yaml

experiment_name: latest-unet-14cls-em-aug

data:
  max_jitter: 48
  num_classes: 14
  target_classes:
    - endo
    - ld
    - lyso
    - mito
    - mt
    - np
    - nuc
    - perox
    - ves
    - vim
    - golgi
    - er
    - eres
  blueprint_json: latest_baseline_centroids.json
  split_ratios: [0.85, 0.09, 0.06]
  excluded_crop: crop234

model:
  out_channels: 14
  strides: [1, 2, 2, 2]

training:
  batch_size: 4
  accumulation_steps: 2
  early_stop_patience: 15
  early_stop_metric: val_dice
  scheduler_mode: max
  print_freq: 200
  num_epochs: 100

augmentation:
  enabled: true
  # Geometric
  flip: true
  rotate90: true
  # Intensity
  intensity_scale_range: [0.8, 1.2]
  intensity_shift_range: [-0.1, 0.1]
  gaussian_noise_std: 0.03
  gamma_range: [0.7, 1.5]
  # Elastic deformation
  elastic_enabled: true
  elastic_alpha: 80.0
  elastic_sigma: 10.0
  elastic_prob: 0.3
  # Resolution augmentation OFF for this variant
  resolution_aug_enabled: false
