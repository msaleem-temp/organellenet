# ============================================================================
# Latest UNet — 14 classes (incl. Vimentin), jitter=48, Dice-based early stopping
# ============================================================================
# Corresponds to the original latest_baseline.py
# Key differences from base: 14 classes, stride-1 first layer, grad accumulation,
# Dice-based scheduling/early-stopping, crop234 exclusion
inherits: base.yaml

experiment_name: rfs-unet-13_classes

data:
  max_jitter: 0
  num_classes: 13
  target_classes:
    # 1. Mitochondria
    - mito
    - mito_lum
    - mito_mem
    - mito_ribo
    # 2. Vesicles
    - ves
    - ves_lum
    - ves_mem
    # 3. Endosomes
    - endo
    - endo_lum
    - endo_mem
    # 4. Lysosomes
    - lyso
    - lyso_lum
    - lyso_mem
    # 5. Lipid Droplets
    - ld
    - ld_lum
    - ld_mem
    # 6. Nucleus
    - nuc
    - ne
    - ne_mem
    - ne_lum
    - chrom
    - echrom
    - hchrom
    - nhchrom
    - nechrom
    - nucpl
    - nucleo
    # 7. Nuclear Pores
    - np
    - np_in
    - np_out
    # 8. Microtubules
    - mt
    - mt_in
    - mt_out
    # 9. Peroxisomes
    - perox
    - perox_lum
    - perox_mem
    # 10. Golgi Apparatus
    - golgi
    - golgi_lum
    - golgi_mem
    # 11. Endoplasmic Reticulum 
    - er
    - er_lum
    - er_mem
    # 12. ER Exit Sites
    - eres
    - eres_lum
    - eres_mem
    # 13. Vimentin
    - vim


  blueprint_json: latest_baseline_centroids.json
  split_ratios: [0.85, 0.09, 0.06]
  excluded_crop: crop234
  
  num_samples: 1600
  crop_rfs_weights: crop_rfs_weights.json

model:
  out_channels: 13
  strides: [2, 2, 2, 2]

training:
  batch_size: 4
  accumulation_steps: 2
  early_stop_patience: 15
  early_stop_metric: val_dice
  scheduler_mode: max
  print_freq: 1
  num_epochs: 3
